name: Install Script Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Run install.sh tests
        run: sh test/install_test.sh
